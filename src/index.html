<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Metronome</title>
  <meta name="description"
    content="A free, minimal, no-nonsense online metronome app. Includes advanced features like subdivisions.">
  <meta name="author" content="Ultraegern">
  <link rel="icon" href="___BUILDSCRIPT_INLINES_ICON_HERE___">
  <link rel="manifest" href="___BUILDSCRIPT_INJECTS_WEB_MANIFEST_HERE___">

  <meta property="og:title" content="Metronome">
  <meta property="og:description"
    content="A free, minimal, no-nonsense online metronome app. Includes advanced features like subdivisions.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ultraegern.github.io/metronome/">

  <style>
    /* ___BUILDSCRIPT_INJECTS_CSS_HERE___ */

<body>
  <main>
    <h1>Metronome</h1>
    <div class="button-group">
      <button id="startBtn">Start</button>
      <button id="stopBtn" disabled>Stop</button>
    </div>

    <div class="control-group">
      <div>
        <label for="bpmRange">Tempo:</label>
        <span id="bpmValue">120</span>
        <label>BPM</label>
      </div>
      <input type="range" id="bpmRange" min="40" max="250" value="120">
    </div>

    <div class="control-group">
      <div>
        <label for="beatsRange">Beats:</label>
        <span id="beatsValue">4</span>
      </div>
      <input type="range" id="beatsRange" min="1" max="10" value="4">
    </div>

    <div class="control-group">
      <label for="patternSelect">Subdivision:</label>
      <select id="patternSelect">
        <option data-mask="[true]">𝅘𝅥 Quarter</option>
        <option data-mask="[true, true]">𝅘𝅥𝅮𝅘𝅥𝅮 Eighth</option>
        <option data-mask="[true, true, true]">𝅘𝅥𝅮𝅘𝅥𝅮𝅘𝅥𝅮 Triplets</option>
        <option data-mask="[true, false, true]">𝅘𝅥𝅮𝄾𝅘𝅥𝅮 Triplets (Syncopated)</option>
        <option data-mask="[true, true, true, true]">𝅘𝅥𝅯𝅘𝅥𝅯𝅘𝅥𝅯𝅘𝅥𝅯 Sixteenths</option>
        <option data-mask="[true, false, false, true]">𝅘𝅥𝅯𝄿𝄿𝅘𝅥𝅯 Sixteenths (Gallop)</option>
      </select>
    </div>
  </main>
  <footer>
    <span>v___BUILDSCRIPT_INJECTS_VERSION_HERE___</span>
    <span>•</span>
    <a href="https://github.com/Ultraegern/metronome" target="_blank" rel="noopener noreferrer">Source</a>
  </footer>

  <script>

  </script>
</body>

</html>
